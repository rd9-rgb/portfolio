<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biglietto da Visita — Studio Legale</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy: #1a2744;
            --navy-light: #243352;
            --gold: #c5a065;
            --gold-dim: #a38550;
            --cream: #f5f0e8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #e0ddd8;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .card-wrapper {
            width: 85mm;
            height: 55mm;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        /* === FRONT === */
        .card-front {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, var(--navy) 0%, #0f1728 100%);
            border-radius: 3mm;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(197,160,101,0.15);
        }

        .card-front::before {
            content: '';
            position: absolute;
            top: -30mm; right: -30mm;
            width: 80mm; height: 80mm;
            border: 1px solid rgba(197,160,101,0.08);
            border-radius: 50%;
        }

        .card-front::after {
            content: '';
            position: absolute;
            bottom: -20mm; left: -20mm;
            width: 60mm; height: 60mm;
            border: 1px solid rgba(197,160,101,0.06);
            border-radius: 50%;
        }

        .logo-circle {
            width: 18mm;
            height: 18mm;
            border: 1.5px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 3mm;
            position: relative;
            z-index: 1;
        }

        .logo-circle span {
            font-family: 'Cormorant Garamond', serif;
            font-size: 10mm;
            color: var(--gold);
            font-weight: 700;
            line-height: 1;
        }

        .card-front h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 6mm;
            color: var(--gold);
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        .card-front .tagline {
            font-size: 2.2mm;
            color: rgba(197,160,101,0.6);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 1mm;
            position: relative;
            z-index: 1;
        }

        /* === BACK === */
        .card-back {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, var(--navy) 0%, #0f1728 100%);
            border-radius: 3mm;
            position: relative;
            overflow: hidden;
            display: flex;
            padding: 6mm;
            border: 1px solid rgba(197,160,101,0.15);
        }

        .back-left {
            width: 35%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 1px solid rgba(197,160,101,0.15);
            padding-right: 3mm;
        }

        .back-left .logo-small {
            font-family: 'Cormorant Garamond', serif;
            font-size: 8mm;
            color: var(--gold);
            font-weight: 700;
            line-height: 1;
        }

        .back-left .firm-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3mm;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 1mm;
            text-align: center;
        }

        .back-right {
            width: 65%;
            padding-left: 4mm;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .person-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 4.5mm;
            color: var(--cream);
            font-weight: 600;
            margin-bottom: 0.5mm;
        }

        .person-role {
            font-size: 2.2mm;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 3mm;
        }

        .divider {
            width: 15mm;
            height: 0.3mm;
            background: var(--gold);
            margin-bottom: 3mm;
            opacity: 0.5;
        }

        .contact-line {
            font-size: 2.2mm;
            color: rgba(245,240,232,0.7);
            margin-bottom: 1.2mm;
            display: flex;
            align-items: center;
            gap: 1.5mm;
        }

        .contact-line strong {
            color: var(--gold);
            font-weight: 500;
            min-width: 4mm;
        }

        /* === PRINT === */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .card-wrapper {
                box-shadow: none;
                page-break-after: always;
            }
            .print-btn { display: none; }
        }

        .print-btn {
            padding: 1rem 2.5rem;
            background: var(--navy);
            color: var(--gold);
            border: 2px solid var(--gold);
            border-radius: 50px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }

        .print-btn:hover {
            background: var(--gold);
            color: var(--navy);
        }

        .label {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="label">Fronte</div>
    <div class="card-wrapper">
        <div class="card-front">
            <div class="logo-circle">
                <span>R</span>
            </div>
            <h1>Rossi & Associati</h1>
            <div class="tagline">Studio Legale</div>
        </div>
    </div>

    <div class="label">Retro</div>
    <div class="card-wrapper">
        <div class="card-back">
            <div class="back-left">
                <div class="logo-small">R</div>
                <div class="firm-name">Rossi &<br>Associati</div>
            </div>
            <div class="back-right">
                <div class="person-name">Avv. Marco Rossi</div>
                <div class="person-role">Founding Partner</div>
                <div class="divider"></div>
                <div class="contact-line"><strong>T</strong> +39 06 678 9012</div>
                <div class="contact-line"><strong>E</strong> info@rossiassociati.it</div>
                <div class="contact-line"><strong>W</strong> www.rossiassociati.it</div>
                <div class="contact-line"><strong>A</strong> Via del Corso 156, Roma</div>
            </div>
        </div>
    </div>

    <button class="print-btn" onclick="window.print()">🖨️ Stampa Biglietti / Salva PDF</button>

</body>
</html>
