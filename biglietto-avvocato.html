<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biglietto da Visita — Rossi & Associati</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #121212;
            color: #a0a0a0;
            padding: 4rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4rem;
            min-height: 100vh;
        }

        /* Elegant Page Header */
        .page-header {
            text-align: center;
            position: relative;
            padding-bottom: 2rem;
        }

        .page-header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 1px;
            background: linear-gradient(to right, transparent, #c9a96e, transparent);
        }

        .page-header .overline {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: #c9a96e;
            margin-bottom: 1.2rem;
            display: block;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.2rem, 5vw, 3.5rem);
            font-weight: 600;
            color: #f0f0f0;
            letter-spacing: 1px;
            line-height: 1.1;
            margin-bottom: 0.8rem;
        }

        .page-header h1 em {
            font-style: italic;
            font-weight: 400;
            color: #c9a96e;
        }

        .page-header .subtitle {
            font-size: 0.9rem;
            font-weight: 300;
            color: #666;
            letter-spacing: 1px;
        }

        /* Card Section */
        .card-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            position: relative;
        }

        .card-label {
            font-family: 'Playfair Display', serif;
            font-size: 0.85rem;
            color: #c9a96e;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 500;
            position: relative;
            padding-bottom: 0.8rem;
        }

        .card-label::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 1px;
            background: #c9a96e;
            opacity: 0.5;
        }

        .card-wrapper {
            width: 85mm;
            height: 55mm;
            border-radius: 3mm;
            overflow: hidden;
            box-shadow: 0 30px 70px rgba(0,0,0,0.7), 0 0 0 1px rgba(201,169,110,0.08);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            background: transparent;
        }

        .card-wrapper:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), 0 0 30px rgba(201,169,110,0.1);
        }

        .card-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Info Block */
        .info-block {
            text-align: center;
            max-width: 400px;
            margin-top: -1rem;
        }

        .info-block p {
            font-size: 0.85rem;
            line-height: 1.8;
            color: #777;
            font-weight: 300;
        }

        .info-block strong {
            color: #c9a96e;
            font-weight: 500;
        }

        /* Print Button */
        .print-btn {
            padding: 1.1rem 3.5rem;
            background: transparent;
            color: #c9a96e;
            border: 1.5px solid rgba(201,169,110,0.4);
            border-radius: 50px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .print-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #c9a96e;
            transition: left 0.3s ease;
            z-index: -1;
        }

        .print-btn:hover {
            color: #121212;
            border-color: #c9a96e;
        }

        .print-btn:hover::before {
            left: 0;
        }

        /* Print */
        @media print {
            body {
                background: white;
                padding: 0;
                gap: 0;
            }
            .page-header,
            .card-label,
            .info-block,
            .print-btn { 
                display: none; 
            }
            .card-wrapper {
                box-shadow: none;
                page-break-after: always;
                margin: 0 auto;
                transform: none !important;
            }
            .card-section {
                gap: 0;
            }
        }

        @media (max-width: 768px) {
            body { padding: 2.5rem 1.5rem; gap: 3rem; }
            .page-header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="page-header">
        <span class="overline">Identità Visiva</span>
        <h1>Rossi <em>&</em> Associati</h1>
        <div class="subtitle">Biglietto da Visita — Formato 85 × 55 mm</div>
    </div>

    <div class="card-section">
        <div class="card-label">Fronte</div>
        <div class="card-wrapper">
            <img src="card2.png" alt="Fronte biglietto da visita">
        </div>
    </div>

    <div class="card-section">
        <div class="card-label">Retro</div>
        <div class="card-wrapper">
            <img src="card1.png" alt="Retro biglietto da visita">
        </div>
    </div>

    <button class="print-btn" onclick="window.print()">🖨️ Stampa / Salva PDF</button>

</body>
</html>
